# Render Blueprint — Styx Peer-Audited Behavioral Market
# https://render.com/docs/blueprint-spec

services:
  # --- API (NestJS) ---
  - type: web
    name: styx-api
    runtime: node
    region: oregon
    plan: starter
    # Uncomment for auto-scaling after upgrading from Starter:
    # scaling:
    #   minInstances: 1
    #   maxInstances: 3
    #   targetMemoryPercent: 75
    #   targetCPUCent: 75
    buildCommand: npm install --include=dev && npx turbo run build --filter=@styx/api
    startCommand: cd src/api && node dist/api/src/main.js
    healthCheckPath: /health
    envVars:
      # Pin the runtime. Without this Render picks its own current default, so
      # production runs the same supported Node 24 LTS line as CI and the
      # Dockerfiles. TypeScript 7 is intentionally a separate migration.
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: styx-db
          property: connectionString
      - key: REDIS_BULLMQ_URL
        fromService:
          name: styx-redis-bullmq
          type: redis
          property: connectionString
      - key: REDIS_CACHE_URL
        fromService:
          name: styx-redis-cache
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STYX_API_KEY_PEPPER
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          name: styx-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Fail CLOSED on an unresolvable location. This was `allow`, which made
      # every request without a usable geo header resolve to TIER_1 FULL_ACCESS
      # — including non-US IPs, which resolve to null — silently defeating the
      # US-only boundary (DR-003). The source default is fail-closed and its
      # comment says production must not be more permissive than dev; this
      # blueprint was the thing overriding it.
      # Render terminates TLS and forwards the client address in x-forwarded-for.
      # Without this, geolocation reads the reverse-proxy socket instead, no US
      # state resolves, and the fail-closed setting below would 403 every
      # geofenced route — including read-only ones. The two must ship together.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: GEO_MISSING_HEADER_ACTION
        value: block
      # Off is correct for the Phase 1 test-money pilot: KYC runtime enforcement
      # is explicitly out of scope and must be labelled inactive
      # (planning--phase1-private-beta-scope.md). It must flip to "true" before
      # any real-money activation — StripeProductionGuard now refuses to serve a
      # live key while this is off, so the two cannot drift apart.
      - key: KYC_ENFORCEMENT_ENABLED
        value: "false"

  # --- Web (Next.js) ---
  - type: web
    name: styx-web
    runtime: node
    region: oregon
    plan: starter
    # Uncomment for auto-scaling after upgrading from Starter:
    # scaling:
    #   minInstances: 1
    #   maxInstances: 3
    #   targetMemoryPercent: 75
    #   targetCPUCent: 75
    buildCommand: npm install --include=dev && npx turbo run build --filter=@styx/web
    startCommand: cd src/web && npm start -- --port $PORT
    envVars:
      # Pin the runtime. Without this Render picks its own current default, so
      # production runs the same supported Node 24 LTS line as CI and the
      # Dockerfiles. TypeScript 7 is intentionally a separate migration.
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: styx-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_STYX_WEB_VERSION
        value: "0.1.0"
      - key: SENTRY_DSN
        sync: false

  # --- Key-Value: BullMQ Queues ---
  - type: redis
    name: styx-redis-bullmq
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # --- Key-Value: Cache / SSE / Anomaly Detection ---
  - type: redis
    name: styx-redis-cache
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: styx-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []  # Allow all (Render internal networking)
