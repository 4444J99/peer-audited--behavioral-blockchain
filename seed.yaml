schema_version: "1.0"
organ: III
organ_name: Commerce
repo: peer-audited--behavioral-blockchain
org: 4444J99

metadata:
  implementation_status: PROTOTYPE
  tier: flagship
  promotion_status: PUBLIC_PROCESS
  last_validated: "2026-08-31"
  generated: "2026-02-22"
  language: typescript
  tags: [nestjs, nextjs, react-native, tauri, stripe, groq, llama, postgresql, redis]

agents:
  - name: ci
    trigger: on_push
    workflow: .github/workflows/ci.yml
    description: "Continuous integration pipeline"
  - name: governance-auditor
    trigger: on_schedule
    workflow: .github/workflows/blocked-handoff-burndown.yml
    description: "Weekly automated audit and index generation for blocked handoffs"

# seed/v1's agents[].trigger enum cannot represent GitHub issue events. Preserve
# this truthful extension instead of misclassifying the live workflow as manual.
issue_triggered_agents:
  - name: governance-intake
    trigger: on_issue
    workflow: .github/workflows/blocked-handoff-intake.yml
    description: "Normalizes blocked handoff metadata during issue intake"

consumes:
  - type: theory
    source: organvm-i-theoria/styx-behavioral-economics-theory
    description: "Behavioral economics models (loss aversion coefficient 1.955, prospect theory) and game-theoretic peer audit proofs"
  - type: creative-artifact
    source: organvm-ii-poiesis/styx-behavioral-art
    description: "Artistic visualization of stake/commitment/audit cycles informing UX design"
  - type: governance-rules
    source: organvm-iv-taxis/orchestration-start-here
    description: "CI/CD and promotion governance rules"

produces:
  - type: product-artifact
    description: "Styx prototype source across NestJS API, Next.js web, React Native mobile, and Tauri desktop workspaces; no complete public deployment is evidenced"
  - type: community_signal
    description: "Product milestones trigger community events"
    consumers: [organvm-vi-koinonia/community-hub]
  - type: distribution_signal
    description: "Releases trigger POSSE distribution"
    consumers: [organvm-vii-kerygma/kerygma-pipeline]
  - type: essay_material
    description: "Development milestones feed essay topics"
    consumers: [organvm-v-logos/essay-pipeline]

subscriptions:
  - event: theory.updated
    source: organvm-i-theoria/styx-behavioral-economics-theory
    action: Review theory changes for product implications
  - event: governance.updated
    source: ORGAN-IV
    action: Check compliance with updated governance rules
  - event: community.event_created
    source: ORGAN-VI
    action: Community event registered for this product
  - event: distribution.dispatched
    source: ORGAN-VII
    action: Announcement distributed via POSSE pipeline
