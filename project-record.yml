      it does not establish a hosted beta, real-money service, clinical
      deployment, or public launch.
    assertion_ref: docs/evidence/assertions/deployment-boundary.assertion-evidence.json
    assertion_id: styx.deployment-boundary

  - id: no-outcome-or-adoption-evidence
    statement: >-
      The repository does not substantiate user adoption, revenue, conversion,
      clinical outcomes, or enterprise-scale operation.

  - id: ownership-unresolved
    statement: >-
      The founder agreement describing ownership and role allocation is
      unsigned; repository stewardship must not be presented as adjudicated
      legal ownership.
