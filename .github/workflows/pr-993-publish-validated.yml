name: PR 993 validated blob export

# Temporary transport only. The connected app performs the branch update with
# its existing workflows permission; this job never updates any branch or tag.
on:
  push:
    branches: [dependabot/npm_and_yarn/npm-deps-bf6561acc1]
    paths: [.github/workflows/pr-993-publish-validated.yml]
permissions:
  contents: write
  pull-requests: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the validated input, successful job, and current PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '6c5873bb632804b2675e3e56fa9623614b5f8f2e'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/pr-993-publish-validated.yml'
          gh api repos/4444J99/peer-audited--behavioral-blockchain/pulls/993 > "$RUNNER_TEMP/pr.json"
          gh api repos/4444J99/peer-audited--behavioral-blockchain/actions/runs/35272046254 > "$RUNNER_TEMP/run.json"
          gh api repos/4444J99/peer-audited--behavioral-blockchain/actions/runs/35272046254/jobs > "$RUNNER_TEMP/jobs.json"
          python3 - <<'PY'
          import json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          pr = json.loads((temp / 'pr.json').read_text())
          run = json.loads((temp / 'run.json').read_text())
          jobs = json.loads((temp / 'jobs.json').read_text())['jobs']
          assert pr['state'] == 'open' and pr['head']['sha'] == os.environ['GITHUB_SHA']
          assert pr['head']['repo']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert pr['head']['ref'] == 'dependabot/npm_and_yarn/npm-deps-bf6561acc1'
          assert run['head_sha'] == '6c5873bb632804b2675e3e56fa9623614b5f8f2e'
          assert run['path'] == '.github/workflows/pr-993-compatibility-repair.yml'
          valid = [job for job in jobs if job['name'] == 'validate']
          assert len(valid) == 1 and valid[0]['id'] == 105373547749
          assert valid[0]['conclusion'] == 'success'
          assert all(step['conclusion'] == 'success' for step in valid[0]['steps'])
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10518601973'
          merge-multiple: true
          run-id: 35272046254
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-repair
      - name: Recompute reviewed edits and export content-addressed blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/pr993-compatibility-repair.py > "$RUNNER_TEMP/expected-files.txt"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, shutil, subprocess, urllib.parse
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          source = temp / 'verified-repair' / 'package-lock.json'
          assert source.is_file() and not source.is_symlink() and source.stat().st_size < 10000000
          lock = json.loads(source.read_text())
          assert lock['lockfileVersion'] == 3
          for manifest in [pathlib.Path('package.json'), *pathlib.Path('src').glob('*/package.json'), *pathlib.Path('packages').glob('*/package.json')]:
              folder = '' if manifest.parent == pathlib.Path('.') else manifest.parent.as_posix()
              package = json.loads(manifest.read_text())
              for field in ['dependencies','devDependencies','optionalDependencies','engines']:
                  assert lock['packages'][folder].get(field,{}) == package.get(field,{}), (folder,field)
          for key, record in lock['packages'].items():
              resolved = record.get('resolved')
              if resolved and not record.get('link'):
                  url = urllib.parse.urlsplit(resolved)
                  assert url.scheme == 'https' and url.hostname == 'registry.npmjs.org', key
              name = key.rsplit('node_modules/',1)[-1]
              if name == 'multer': assert record['version'] == '2.4.0'
              if name == 'postcss': assert record['version'] == '8.5.28'
          shutil.copyfile(source, 'package-lock.json')
          expected = set((temp / 'expected-files.txt').read_text().splitlines()) | {'package-lock.json'}
          actual = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          actual |= set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert actual == expected, actual ^ expected
          subprocess.run(['git','diff','--check'], check=True)
          elements = []
          for file in sorted(expected):
              data = pathlib.Path(file).read_bytes()
              digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              request = json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              response = subprocess.check_output(['gh','api','repos/4444J99/peer-audited--behavioral-blockchain/git/blobs','--input','-'], input=request)
              blob = json.loads(response)
              assert blob['sha'] == digest, file
              elements.append({'path':file,'mode':'100644','type':'blob','sha':digest})
          receipt = {'inputHead':os.environ['GITHUB_SHA'],'validatedHead':'6c5873bb632804b2675e3e56fa9623614b5f8f2e','validatedRun':35272046254,'treeElements':elements}
          output = json.dumps(receipt, indent=2)
          (temp / 'validated-blobs.json').write_text(output + '\n')
          print(output)
          print('No ref was updated. Publication requires the connected app with workflows permission.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-993-validated-blobs-${{ github.sha }}
          path: ${{ runner.temp }}/validated-blobs.json
          if-no-files-found: error
          retention-days: 2
