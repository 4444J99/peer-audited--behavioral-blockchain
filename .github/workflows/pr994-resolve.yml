name: PR 994 resolver acceptance
on:
  push:
    branches: [work/lane-verify/ci-gate-fixes-2026-09-17]
    paths: [.github/workflows/pr994-resolve.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pr994_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@10.8.2
      - name: Anchor native peers and regenerate stale resolution inputs
        run: |
          mkdir -p "$RUNNER_TEMP/pr994-evidence"
          node <<'JS'
          const fs=require('fs');
          const root=JSON.parse(fs.readFileSync('package.json','utf8'));
          root.devDependencies['react-native']='0.86.3';
          Object.assign(root.overrides, {'react-native':'0.86.3','@react-native-async-storage/async-storage':'2.2.0',xcode:{uuid:'11.1.1'},'@react-navigation/native':'7.4.1','@react-navigation/core':'7.22.1'});
          fs.writeFileSync('package.json',JSON.stringify(root,null,2)+'\n');
          const mobile=JSON.parse(fs.readFileSync('src/mobile/package.json','utf8'));
          Object.assign(mobile.dependencies, {
            '@react-navigation/native':'7.4.1','@react-native-async-storage/async-storage':'2.2.0',
            expo:'~57.0.23','expo-camera':'~57.0.5','expo-crypto':'~57.0.3',
            'expo-notifications':'~57.0.19','expo-application':'~57.0.3','expo-constants':'~57.0.18',
            'react-native':'0.86.3','react-native-safe-area-context':'~5.7.0','react-native-screens':'~4.26.0'
          });
          Object.assign(mobile.devDependencies, {'@react-native/metro-config':'0.86.3','@types/jest':'29.5.14',jest:'~29.7.0','jest-environment-jsdom':'29.7.0'});
          fs.writeFileSync('src/mobile/package.json',JSON.stringify(mobile,null,2)+'\n');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const regenerated=[];
          for(const key of Object.keys(lock.packages)) {
            if(/(^|\/)node_modules\/(react-native|react-native-nitro-modules|@react-native-async-storage\/async-storage|@react-native\/virtualized-lists)(\/|$)/.test(key)) {
              regenerated.push(key);delete lock.packages[key];
            }
          }
          fs.writeFileSync(process.env.RUNNER_TEMP+'/pr994-evidence/regenerated-inputs.json',JSON.stringify(regenerated,null,2)+'\n');
          fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          JS
          set -o pipefail
          npm update @react-navigation/native @react-navigation/core xcode uuid react-native @react-native/metro-config expo expo-camera expo-crypto expo-notifications expo-application expo-constants @react-native-async-storage/async-storage react-native-safe-area-context react-native-screens jest jest-environment-jsdom @types/jest --package-lock-only --ignore-scripts --engine-strict --strict-peer-deps 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/generation.log"
          npm ci --engine-strict --strict-peer-deps 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/strict-install.log"
      - name: Verify installed native graph
        run: |
          set -o pipefail
          node scripts/ci/check-dependency-graph.mjs 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/graph.log"
          (cd src/mobile && CI=1 npx expo install --check) 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/expo-check.log"
      - name: Publish strictly installable dependency changes to unchanged PR head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh auth setup-git
          branch=work/lane-verify/ci-gate-fixes-2026-09-17
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/mobile/package.json package-lock.json
          git diff --cached --check
          git commit -m 'fix(deps): unify SDK native peers and regenerate audited dependency graph'
          git push origin HEAD:refs/heads/$branch
      - name: Verify committed head without write credentials
        env:
          PR994_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pr994_test
        run: bash scripts/ci/verify-pr994.sh
      - name: Collect canonical diagnostics without masking failure
        if: always()
        run: |
          out="$RUNNER_TEMP/pr994-evidence"
          set +e
          if test -x node_modules/.bin/turbo; then
            timeout 600 npx turbo run test > "$out/canonical-tests.log" 2>&1; echo "$?" > "$out/canonical-tests-exit.txt"
            timeout 300 npx turbo run build > "$out/canonical-build.log" 2>&1; echo "$?" > "$out/canonical-build-exit.txt"
            timeout 180 npx turbo run lint > "$out/canonical-lint.log" 2>&1; echo "$?" > "$out/canonical-lint-exit.txt"
          fi
          npm audit --json > "$out/candidate-audit.json"
          git rev-parse HEAD > "$out/head.txt"
          git status --porcelain > "$out/status.txt"
          git diff --binary --full-index > "$out/candidate.diff"
          cp package-lock.json "$out/candidate-lock.json"
          git archive --format=tar.gz HEAD > "$out/source.tar.gz"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr994-resolver-${{ github.run_id }}
          path: ${{ runner.temp }}/pr994-evidence/
          retention-days: 14
