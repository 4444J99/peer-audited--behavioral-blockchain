name: PR 993 security patch repair

# Temporary, single-PR writer. Remove after validated dependency patches land.
on:
  push:
    branches: [dependabot/npm_and_yarn/npm-deps-bf6561acc1]
    paths: [.github/workflows/pr-993-audit-repair.yml]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-993-security-patch-repair
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == '4444J99/peer-audited--behavioral-blockchain'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Guard the exact open PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/4444J99/peer-audited--behavioral-blockchain/pulls/993 > "$RUNNER_TEMP/pr.json"
          python3 - <<'PY'
          import json, os
          pr = json.load(open(os.environ['RUNNER_TEMP'] + '/pr.json'))
          assert pr['state'] == 'open'
          assert pr['head']['repo']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert pr['head']['ref'] == 'dependabot/npm_and_yarn/npm-deps-bf6561acc1'
          assert pr['head']['sha'] == os.environ['GITHUB_SHA'], 'Stale head'
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Apply only the two reviewed security overrides
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('package.json')
          package = json.loads(path.read_text())
          assert package['overrides']['postcss'] == '8.5.15'
          assert package['overrides']['multer'] == '>=2.1.0'
          package['overrides']['postcss'] = '8.5.26'
          package['overrides']['multer'] = '2.3.0'
          path.write_text(json.dumps(package, indent=2) + '\n')
          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text())
          records = lock['packages']
          names = {'postcss', 'multer', 'tailwindcss', '@tailwindcss/postcss', '@tailwindcss/node', '@tailwindcss/oxide'}
          roots = [k for k in records if 'node_modules/' in k and k.rsplit('node_modules/', 1)[1] in names]
          removed = [k for k in records if k in roots or any(k.startswith(r + '/node_modules/') for r in roots)]
          for k in removed:
              del records[k]
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')
          print('Regenerating stale security/CSS lock records:', len(removed))
          PY
          version="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npm install --global "npm@${version}" --ignore-scripts
          npm view postcss@8.5.26 version engines --json
          npm view multer@2.3.0 version engines --json
      - name: Regenerate and clean-install with strict dependency validation
        env:
          npm_config_engine_strict: 'true'
        run: |
          npm install --package-lock-only --ignore-scripts --strict-peer-deps --no-audit --no-fund
          npm ci --ignore-scripts --strict-peer-deps --no-audit --no-fund
      - name: Keep the high-severity audit gate enforcing
        run: npm audit --audit-level=high
      - name: Preserve Expo SDK 57 compatibility
        working-directory: src/mobile
        env:
          CI: '1'
        run: npx --no-install expo install --check
      - name: Validate every installed security patch and workspace record
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const dir of ['', 'src/api', 'src/mobile', 'src/test-harness']) {
            const manifest = JSON.parse(fs.readFileSync(path.join(dir, 'package.json'), 'utf8'));
            for (const field of ['dependencies', 'devDependencies', 'optionalDependencies', 'engines']) {
              assert.deepEqual(lock.packages[dir][field] || {}, manifest[field] || {}, `${dir}: ${field}`);
            }
          }
          for (const [key, record] of Object.entries(lock.packages)) {
            const name = key.split('node_modules/').pop();
            if (name === 'multer') assert.equal(record.version, '2.3.0', key);
            if (name === 'postcss') assert.equal(record.version, '8.5.26', key);
          }
          const harness = createRequire(path.resolve('src/test-harness/package.json'));
          assert.equal(harness('js-yaml/package.json').version, '5.4.2');
          console.log(JSON.stringify({ head: process.env.GITHUB_SHA, node: process.version, postcss: '8.5.26', multer: '2.3.0', yaml: '5.4.2' }, null, 2));
          JS
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-993-security-patches-${{ github.sha }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: pr-993-security-patches-${{ github.sha }}
          path: ${{ runner.temp }}/validated-patches
      - name: Publish only the validated manifest and lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api repos/4444J99/peer-audited--behavioral-blockchain/pulls/993 --jq '.head.sha')"
          test "$current" = "$GITHUB_SHA" || { echo 'Stale head; refusing write'; exit 1; }
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'validated-patches'
          for name in ['package.json', 'package-lock.json']:
              p = root / name
              assert p.is_file() and not p.is_symlink() and p.stat().st_size < 10000000
          expected = json.loads(pathlib.Path('package.json').read_text())
          expected['overrides']['postcss'] = '8.5.26'
          expected['overrides']['multer'] = '2.3.0'
          actual = json.loads((root / 'package.json').read_text())
          assert actual == expected, 'Unexpected manifest changes'
          lock = json.loads((root / 'package-lock.json').read_text())
          assert lock['lockfileVersion'] == 3
          for folder in ['', 'src/api', 'src/mobile', 'src/test-harness']:
              manifest = actual if not folder else json.loads((pathlib.Path(folder) / 'package.json').read_text())
              for field in ['dependencies', 'devDependencies', 'optionalDependencies', 'engines']:
                  assert lock['packages'][folder].get(field, {}) == manifest.get(field, {}), (folder, field)
          for name in ['package.json', 'package-lock.json']:
              shutil.copyfile(root / name, name)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = 'package-lock.json package.json '
          git commit -m 'fix(security): patch Multer and PostCSS without weakening audit gates'
          git push origin HEAD:refs/heads/dependabot/npm_and_yarn/npm-deps-bf6561acc1
          printf 'Input head: `%s`\n\nOutput head: `%s`\n' "$GITHUB_SHA" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
