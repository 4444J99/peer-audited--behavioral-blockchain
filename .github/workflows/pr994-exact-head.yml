name: PR 994 exact-head verification

on:
  push:
    branches: [work/lane-verify/ci-gate-fixes-2026-09-17]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr994-exact-head-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/work/lane-verify/ci-gate-fixes-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture exact source and provenance
        run: |
          mkdir -p "$RUNNER_TEMP/pr994-evidence"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pr994-evidence/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/pr994-evidence/head.txt"
          git status --porcelain > "$RUNNER_TEMP/pr994-evidence/status.txt"
      - name: Retain source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pr994-source-${{ github.sha }}
          path: ${{ runner.temp }}/pr994-evidence/
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Use repository package manager
        run: npm install --global npm@10.8.2
      - name: Verify clean lockfile installation
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/npm-ci.log"
      - name: Verify shared build
        if: steps.install.outcome == 'success'
        id: shared
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build --workspace=@styx/shared 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/shared-build.log"
      - name: Verify API types
        if: steps.shared.outcome == 'success'
        id: api
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint --workspace=@styx/api 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/api-types.log"
      - name: Run regression tests
        if: steps.shared.outcome == 'success'
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test --workspaces --if-present 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/tests.log"
      - name: Audit production dependencies at High threshold
        if: steps.install.outcome == 'success'
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high --json 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/npm-audit.json"
      - name: Record step outcomes
        if: always()
        env:
          HEAD_SHA: ${{ github.sha }}
          INSTALL: ${{ steps.install.outcome }}
          SHARED: ${{ steps.shared.outcome }}
          API: ${{ steps.api.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          node -e 'const fs=require("fs"); const result={headSha:process.env.HEAD_SHA,checked_at:new Date().toISOString(),run:process.env.GITHUB_RUN_ID,statuses:Object.fromEntries(["INSTALL","SHARED","API","TESTS","AUDIT"].map(k=>[k,process.env[k]]))}; fs.writeFileSync(process.env.RUNNER_TEMP+"/pr994-evidence/result.json",JSON.stringify(result,null,2)+"\n"); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"```json\n"+JSON.stringify(result,null,2)+"\n```\n");'
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr994-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr994-evidence/*.log
            ${{ runner.temp }}/pr994-evidence/*.json
            ${{ runner.temp }}/pr994-evidence/head.txt
          retention-days: 7
      - name: Enforce successful verification
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          SHARED: ${{ steps.shared.outcome }}
          API: ${{ steps.api.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          for outcome in "$INSTALL" "$SHARED" "$API" "$TESTS" "$AUDIT"; do
            test "$outcome" = success || exit 1
          done
