name: Styx strict integration acceptance
on:
  push:
    branches: [main, lane/verify, work/lane-verify/ci-gate-fixes-2026-09-17]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: styx-strict-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == '4444J99/peer-audited--behavioral-blockchain' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lane/verify' || github.ref == 'refs/heads/work/lane-verify/ci-gate-fixes-2026-09-17')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pr994_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@10.8.2
      - name: Verify the exact checked-out head
        env:
          PR994_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pr994_test
        run: bash scripts/ci/verify-pr994.sh
      - name: Capture immutable tested source
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pr994-evidence"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pr994-evidence/source.tar.gz"
      - name: Retain numeric results and full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: styx-strict-integration-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr994-evidence/*.log
            ${{ runner.temp }}/pr994-evidence/*.json
            ${{ runner.temp }}/pr994-evidence/*.txt
            ${{ runner.temp }}/pr994-evidence/*.tsv
            ${{ runner.temp }}/pr994-evidence/source.tar.gz
          retention-days: 14
