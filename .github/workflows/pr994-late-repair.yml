name: Apply guarded PR 994 late review repairs
on:
  push:
    branches: [work/lane-verify/ci-gate-fixes-2026-09-17]
    paths: [.github/workflows/pr994-late-repair.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/work/lane-verify/ci-gate-fixes-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply checksummed delta only to unchanged source
        run: |
          python3 <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess
          baseline='3553a9f5a35b0859a66b9440aea81d5901ef5f08'
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines()
          assert changed==['.github/workflows/pr994-late-repair.yml'],f'Concurrent changes: {changed}'
          encoded=''
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='1346aa6a4e180bf3f07714eff8eebd09d735d0078ff26ae53c8150dd1b3d2f56'
          changes=json.loads(raw)
          allowed={'src/web/app/register/page.tsx','src/web/services/browser-registration.ts','src/web/services/browser-registration.test.ts','scripts/demo/share.sh','scripts/demo/snapshot.sh','docs/demo/jessica-demo-runbook.md','scripts/tests/pr994-sharing.test.mjs','scripts/ci/verify-pr994.sh'}
          assert {x['path'] for x in changes}==allowed
          for entry in changes:
            p=pathlib.Path(entry['path']); old=p.read_bytes() if p.exists() else b''
            assert hashlib.sha256(old).hexdigest()==entry['old_sha256'],f'Stale source: {p}'
          for entry in changes:
            p=pathlib.Path(entry['path']); lines=p.read_text().splitlines(True) if p.exists() else []
            for start,end,replacement in reversed(entry['edits']): lines[start:end]=[replacement]
            p.parent.mkdir(parents=True,exist_ok=True);p.write_text(''.join(lines))
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Run dependency-free regression checks without write credentials
        run: node --test scripts/tests/pr994-*.test.mjs
      - name: Commit only to the unchanged requested branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: work/lane-verify/ci-gate-fixes-2026-09-17
        run: |
          gh auth setup-git
          current="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$current" = "$EXPECTED_HEAD" || { echo 'Concurrent head change; refusing push'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(styx): stop claiming browser device identity and restore safe static LAN sharing'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Repaired source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
