name: Dependency compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '.github/workflows/dependency-contract.yml'
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '.github/workflows/dependency-contract.yml'

permissions:
  contents: read

concurrency:
  group: dependency-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 24 satisfies pre-existing API engine requirements; see issue #997.
          node-version: '24'
          cache: npm
      - name: Use the repository npm version
        run: |
          version="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npm install --global "npm@${version}" --ignore-scripts
      - name: Clean install with strict engines and peer dependencies
        env:
          npm_config_engine_strict: 'true'
        run: npm ci --ignore-scripts --strict-peer-deps --no-audit --no-fund
      - name: Check the Expo SDK dependency contract
        working-directory: src/mobile
        env:
          CI: '1'
        run: npx --no-install expo install --check
      - name: Verify installed versions and workspace lock metadata
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const semver = require('semver');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const read = dir => JSON.parse(fs.readFileSync(path.join(dir, 'package.json'), 'utf8'));
          for (const dir of ['', 'src/api', 'src/mobile', 'src/test-harness']) {
            const manifest = read(dir);
            const record = lock.packages[dir];
            assert.ok(record, `Missing lock record: ${dir}`);
            for (const field of ['dependencies', 'devDependencies', 'optionalDependencies', 'engines']) {
              assert.deepEqual(record[field] || {}, manifest[field] || {}, `${dir}: ${field} drift`);
            }
          }
          assert.ok(semver.subset(read('').engines.node, '>=22.13.0'));
          assert.ok(semver.subset(read('src/api').engines.node, '>=22.12.0'));
          assert.ok(semver.subset(read('src/mobile').engines.node, '>=22.13.0'));
          const mobileRequire = createRequire(path.resolve('src/mobile/package.json'));
          const expoPath = mobileRequire.resolve('expo/package.json');
          const expoRequire = createRequire(expoPath);
          const expo = expoRequire('./package.json');
          const bundled = JSON.parse(fs.readFileSync(path.join(path.dirname(expoPath), 'bundledNativeModules.json'), 'utf8'));
          const versions = {};
          for (const name of ['react', 'react-dom', 'react-native', 'expo-notifications', 'expo-application']) {
            versions[name] = mobileRequire(`${name}/package.json`).version;
            assert.ok(semver.satisfies(versions[name], bundled[name]), `${name}: ${versions[name]} outside ${bundled[name]}`);
          }
          const notificationsRequire = createRequire(mobileRequire.resolve('expo-notifications/package.json'));
          for (const [label, resolveFrom] of [['expo', expoRequire], ['notifications', notificationsRequire]]) {
            const constants = resolveFrom('expo-constants/package.json');
            versions[`${label}/expo-constants`] = constants.version;
            assert.ok(semver.satisfies(constants.version, bundled['expo-constants']));
          }
          const harnessRequire = createRequire(path.resolve('src/test-harness/package.json'));
          const yamlVersion = harnessRequire('js-yaml/package.json').version;
          assert.ok(semver.satisfies(yamlVersion, read('src/test-harness').dependencies['js-yaml']));
          console.log(JSON.stringify({ node: process.version, expo: expo.version, versions, yamlVersion }, null, 2));
          JS
      - name: Build the shared workspace
        run: npm run build --workspace @styx/shared
      - name: Verify mobile types and tests
        run: |
          npm run lint --workspace @styx/mobile
          npm run test --workspace @styx/mobile -- --runInBand
      - name: Verify test-harness types and tests
        run: |
          npm run lint --workspace @styx/test-harness
          npm run test --workspace @styx/test-harness
      - name: Ensure validation did not rewrite the lockfile
        run: |
          git diff --exit-code -- package.json package-lock.json src/api/package.json src/mobile/package.json src/test-harness/package.json
          printf 'Verified head: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
