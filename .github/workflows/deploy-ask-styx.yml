name: Deploy Ask Styx to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/ask-styx/**'
      - '.github/workflows/deploy-ask-styx.yml'

permissions:
  contents: read
  pages: write
  id-token: write # allow-secret

concurrency:
  group: ask-styx-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
        working-directory: src/ask-styx
        env:
          VITE_WORKER_URL: ${{ vars.ASK_STYX_WORKER_URL }}

      # Fix Vite bundle collision / 404
      - name: Combine static sites
        run: |
          mkdir _site
          cp -R docs/* _site/ || true
          mkdir -p _site/ask-styx
          cp -R src/ask-styx/dist/* _site/ask-styx/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
