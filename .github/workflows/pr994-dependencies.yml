name: PR 994 guarded dependency repair
on:
  push:
    branches: [work/lane-verify/ci-gate-fixes-2026-09-17]
    paths: [.github/workflows/pr994-dependencies.yml]
permissions:
  contents: write
  actions: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pr994_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture the failed canonical job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr994-evidence"
          gh api repos/${{ github.repository }}/actions/jobs/105373630166/logs > "$RUNNER_TEMP/pr994-evidence/prior-canonical.log" 2>&1 || true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@10.8.2
      - name: Resolve compatible dependency versions
        run: |
          node <<'JS'
          const fs=require('fs');
          const root=JSON.parse(fs.readFileSync('package.json','utf8'));
          Object.assign(root.overrides, {'react-native':'0.86.3',xcode:{uuid:'11.1.1'},'@react-navigation/native':'7.4.1','@react-navigation/core':'7.22.1'});
          fs.writeFileSync('package.json',JSON.stringify(root,null,2)+'\n');
          const mobile=JSON.parse(fs.readFileSync('src/mobile/package.json','utf8'));
          Object.assign(mobile.dependencies, {
            '@react-navigation/native':'7.4.1', '@react-native-async-storage/async-storage':'2.2.0',
            expo:'~57.0.23', 'expo-camera':'~57.0.5', 'expo-crypto':'~57.0.3',
            'expo-notifications':'~57.0.19', 'expo-application':'~57.0.3', 'expo-constants':'~57.0.18',
            'react-native':'0.86.3', 'react-native-safe-area-context':'~5.7.0', 'react-native-screens':'~4.26.0'
          });
          Object.assign(mobile.devDependencies, {'@react-native/metro-config':'0.86.3','@types/jest':'29.5.14',jest:'~29.7.0','jest-environment-jsdom':'29.7.0'});
          fs.writeFileSync('src/mobile/package.json',JSON.stringify(mobile,null,2)+'\n');
          JS
          set -o pipefail
          # Use normal npm resolution during generation, then require strict fresh
          # acceptance below. Neither --force nor --legacy-peer-deps is used.
          npm update @react-navigation/native @react-navigation/core xcode uuid react-native @react-native/metro-config expo expo-camera expo-crypto expo-notifications expo-application expo-constants @react-native-async-storage/async-storage react-native-safe-area-context react-native-screens jest jest-environment-jsdom @types/jest --package-lock-only --ignore-scripts --engine-strict 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/targeted-update.log"
      - name: Require clean strict installation and installed compatibility
        run: |
          set -o pipefail
          npm ci --engine-strict --strict-peer-deps 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/strict-install.log"
          node scripts/ci/check-dependency-graph.mjs 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/graph.log"
          (cd src/mobile && CI=1 npx expo install --check) 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/expo-check.log"
          node --test scripts/ci/dependency-compatibility.test.mjs 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/dependency-compatibility.log"
      - name: Commit accepted dependency graph only to unchanged PR head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh auth setup-git
          branch=work/lane-verify/ci-gate-fixes-2026-09-17
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/mobile/package.json package-lock.json
          git diff --cached --check
          git commit -m 'fix(deps): accept strict SDK-compatible navigation and Xcode graph'
          git push origin HEAD:refs/heads/$branch
      - name: Verify committed head without write credentials
        env:
          PR994_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pr994_test
        run: bash scripts/ci/verify-pr994.sh
      - name: Exercise canonical Turbo commands with retained logs
        if: always()
        run: |
          out="$RUNNER_TEMP/pr994-evidence"
          set +e
          if test -d node_modules; then
            timeout 600 npx turbo run test > "$out/canonical-tests.log" 2>&1; echo "$?" > "$out/canonical-tests-exit.txt"
            timeout 300 npx turbo run build > "$out/canonical-build.log" 2>&1; echo "$?" > "$out/canonical-build-exit.txt"
            timeout 180 npx turbo run lint > "$out/canonical-lint.log" 2>&1; echo "$?" > "$out/canonical-lint-exit.txt"
          fi
          exit 0
      - name: Capture source and audits, including failed candidates
        if: always()
        run: |
          out="$RUNNER_TEMP/pr994-evidence"
          mkdir -p "$out"
          npm audit --json > "$out/candidate-audit.json" || true
          git rev-parse HEAD > "$out/head.txt"
          git status --porcelain > "$out/status.txt"
          git diff --binary --full-index > "$out/candidate.diff"
          cp package-lock.json "$out/candidate-lock.json"
          git archive --format=tar.gz HEAD > "$out/source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr994-dependency-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/pr994-evidence/
          retention-days: 14
