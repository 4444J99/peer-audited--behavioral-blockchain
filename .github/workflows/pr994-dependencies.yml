name: PR 994 guarded dependency repair
on:
  push:
    branches: [work/lane-verify/ci-gate-fixes-2026-09-17]
    paths: [.github/workflows/pr994-dependencies.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pr994_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@10.8.2
      - name: Re-resolve navigation peers without relaxing engine or peer checks
        run: |
          mkdir -p "$RUNNER_TEMP/pr994-evidence"
          node <<'JS'
          const fs=require('fs');
          const root=JSON.parse(fs.readFileSync('package.json','utf8'));
          root.overrides.xcode={uuid:'11.1.1'};
          root.overrides['@react-navigation/native']='7.4.1';
          root.overrides['@react-navigation/core']='7.22.1';
          fs.writeFileSync('package.json',JSON.stringify(root,null,2)+'\n');
          const mobile=JSON.parse(fs.readFileSync('src/mobile/package.json','utf8'));
          mobile.dependencies['@react-navigation/native']='7.4.1';
          fs.writeFileSync('src/mobile/package.json',JSON.stringify(mobile,null,2)+'\n');
          JS
          set -o pipefail
          if ! npm update @react-navigation/native @react-navigation/core --package-lock-only --ignore-scripts --engine-strict --strict-peer-deps 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/targeted-update.log"; then
            # npm 10 can retain the old hoisted peer snapshot during an update.
            # Discard only those generation inputs, then let npm regenerate real
            # versions/integrities. Never invent lock metadata or use --force.
            node <<'JS'
          const fs=require('fs');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const removed=[];
          for(const key of Object.keys(lock.packages)) {
            if (/(^|\/)node_modules\/@react-navigation\/(core|native)(\/|$)/.test(key)) {
              removed.push(key); delete lock.packages[key];
            }
          }
          fs.writeFileSync(process.env.RUNNER_TEMP+'/pr994-evidence/regenerated-lock-inputs.json',JSON.stringify(removed,null,2)+'\n');
          fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          JS
            npm install --package-lock-only --ignore-scripts --engine-strict --strict-peer-deps 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/lock-update.log"
          fi
          npm dedupe --package-lock-only --ignore-scripts --engine-strict --strict-peer-deps 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/lock-dedupe.log"
          npm ci --engine-strict --strict-peer-deps 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/strict-install.log"
          node -e 'const fs=require("fs");fs.copyFileSync(require.resolve("expo/bundledNativeModules.json"),process.env.RUNNER_TEMP+"/pr994-evidence/expo-bundled.json")'
      - name: Align installed Expo modules with the existing SDK
        run: |
          set -o pipefail
          (cd src/mobile && CI=1 npx expo install --fix --npm) 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/expo-fix.log"
          npm install --package-lock-only --ignore-scripts --engine-strict --strict-peer-deps
          npm ci --engine-strict --strict-peer-deps
          node scripts/ci/check-dependency-graph.mjs
      - name: Commit generated dependency graph only to unchanged PR head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh auth setup-git
          branch=work/lane-verify/ci-gate-fixes-2026-09-17
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/mobile/package.json package-lock.json
          git diff --cached --check
          git commit -m 'fix(deps): remove remaining advisories and align Expo peer graph'
          git push origin HEAD:refs/heads/$branch
      - name: Verify committed head without write credentials
        env:
          PR994_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pr994_test
        run: bash scripts/ci/verify-pr994.sh
      - name: Capture exact source and candidate changes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pr994-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/pr994-evidence/head.txt"
          git status --porcelain > "$RUNNER_TEMP/pr994-evidence/status.txt"
          git diff --binary --full-index > "$RUNNER_TEMP/pr994-evidence/candidate.diff"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pr994-evidence/source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr994-dependency-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/pr994-evidence/
          retention-days: 14
