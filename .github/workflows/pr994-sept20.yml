name: PR 994 reviewed repair acceptance
on:
  push:
    branches: [work/lane-verify/ci-gate-fixes-2026-09-17]
    paths: ['.github/workflows/pr994-sept20.yml', 'scripts/ci/pr994-sept20-payload-*.b64']
permissions:
  contents: write
concurrency:
  group: pr994-reviewed-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == '4444J99/peer-audited--behavioral-blockchain' && github.ref == 'refs/heads/work/lane-verify/ci-gate-fixes-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pr994_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@10.8.2
      - name: Apply reviewed changes only to matching source bytes
        run: |
          mkdir -p "$RUNNER_TEMP/pr994-evidence"
          python3 <<'PY'
          import base64,gzip,hashlib,json,pathlib,os
          root=pathlib.Path.cwd()
          encoded=''.join((root/f'scripts/ci/pr994-sept20-payload-{i}.b64').read_text() for i in range(3))
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='7cec1ea3fab0ec1064fe9a3e5f74dee243e3f7d1067966def1f786ee14cfc0bc','Payload digest mismatch'
          changes=json.loads(gzip.decompress(compressed))
          pending=[]
          for change in changes:
              path=root/change['path']
              assert path.resolve().is_relative_to(root) and not change['path'].startswith('.github/')
              old=path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest()==change['before'],f'Source moved: {path}'
              lines=old.decode().splitlines(keepends=True)
              for start,end,replacement in reversed(change['edits']):
                  lines[start:end]=[replacement]
              new=''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest()==change['after'],f'Output mismatch: {path}'
              pending.append((path,new))
          for path,new in pending:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(new)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr994-evidence'
          (out/'allowed-paths.json').write_text(json.dumps([c['path'] for c in changes]+['package-lock.json','src/mobile/package.json']))
          PY
          git diff --check
      - name: Align the three SDK patches required by Expo on September 20
        run: |
          node <<'JS'
          const fs=require('fs');
          const root=JSON.parse(fs.readFileSync('package.json'));
          root.devDependencies.expo='57.0.24';root.overrides.expo='57.0.24';
          fs.writeFileSync('package.json',JSON.stringify(root,null,2)+'\n');
          const mobile=JSON.parse(fs.readFileSync('src/mobile/package.json'));
          Object.assign(mobile.dependencies,{expo:'~57.0.24','expo-constants':'~57.0.19','expo-notifications':'~57.0.20'});
          fs.writeFileSync('src/mobile/package.json',JSON.stringify(mobile,null,2)+'\n');
          JS
      - name: Regenerate lock and require clean strict installation
        run: |
          set -o pipefail
          npm update expo expo-constants expo-notifications --package-lock-only --ignore-scripts --engine-strict --strict-peer-deps 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/lock-generation.log"
          npm ci --engine-strict --strict-peer-deps 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/initial-install.log"
          node scripts/ci/check-dependency-graph.mjs 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/initial-graph.log"
          (cd src/mobile && CI=1 npx expo install --check) 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/initial-expo.log"
      - name: Publish only the reviewed source and generated lock to unchanged PR branch
        env:
          PUSH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 <<'PY'
          import json,os,subprocess,pathlib
          paths=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'pr994-evidence/allowed-paths.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(staged).issubset(paths),'Unexpected staged source'
          assert not any(p.startswith('.github/') for p in staged),'Workflow writes are forbidden'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix(styx): make automatic penalties atomic and retryable; repair acceptance and onboarding'
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          remote="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "$GITHUB_REF" | cut -f1)"
          test "$remote" = "$EXPECTED_HEAD" || { echo 'PR head moved; refusing publication'; exit 1; }
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$GITHUB_REF"
          git rev-parse HEAD > "$RUNNER_TEMP/pr994-evidence/published-head.txt"
      - name: Verify the published head without write credentials
        env:
          PR994_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pr994_test
        run: bash scripts/ci/verify-pr994.sh
      - name: Retain source and failed-candidate evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pr994-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/pr994-evidence/final-head.txt"
          git status --porcelain > "$RUNNER_TEMP/pr994-evidence/final-status.txt"
          git diff --binary > "$RUNNER_TEMP/pr994-evidence/candidate.diff"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pr994-evidence/source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr994-reviewed-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/pr994-evidence/
          retention-days: 14
