name: PR 993 remaining compatibility probes

# Temporary read-only probes. No repository references or external settings change.
on:
  push:
    branches: [dependabot/npm_and_yarn/npm-deps-bf6561acc1]
    paths: [.github/workflows/pr-993-remaining-probe.yml]
permissions:
  contents: read
jobs:
  dependency_metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Inspect published compatible fixes without changing the lockfile
        run: |
          for spec in '@react-navigation/core@7.22.1' '@react-navigation/native@latest' 'query-string@9.4.2' 'decode-uri-component@0.5.0' 'uuid@11.1.1' 'xcode@latest'; do
            printf '\n--- %s ---\n' "$spec"
            npm view "$spec" name version type main exports dependencies peerDependencies engines --json || true
          done
          mkdir -p "$RUNNER_TEMP/pr993-packages"
          cd "$RUNNER_TEMP/pr993-packages"
          npm pack xcode@3.0.1 --ignore-scripts --json > xcode-pack.json
          npm pack uuid@11.1.1 --ignore-scripts --json > uuid-pack.json
          npm pack decode-uri-component@0.5.0 --ignore-scripts --json > decoder-pack.json
          python3 - <<'PY'
          import json, pathlib, tarfile
          for label in ['xcode', 'uuid', 'decoder']:
              packed = json.loads(pathlib.Path(label + '-pack.json').read_text())[0]['filename']
              with tarfile.open(packed) as archive:
                  for member in archive.getmembers():
                      if not member.isfile() or member.size > 1000000:
                          continue
                      if member.name.endswith('package.json') or (label == 'xcode' and member.name.endswith(('.js', '.md'))):
                          text = archive.extractfile(member).read().decode('utf8', errors='replace')
                          if member.name.endswith('package.json'):
                              print('\n---', label, member.name, '---\n', text)
                          elif 'uuid' in text.lower():
                              lines = text.splitlines()
                              for i, line in enumerate(lines):
                                  if 'uuid' in line.lower():
                                      print('\n---', label, member.name, 'line', i + 1, '---')
                                      print('\n'.join(lines[max(0,i-3):i+5]))
          PY
          echo 'Read-only metadata collection, not a passing dependency repair receipt.'
  deployment_runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only the existing Render Node selector and deployment revision
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
          RENDER_WEB_SERVICE_ID: ${{ secrets.RENDER_WEB_SERVICE_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ.get('RENDER_API_KEY')
          results = []
          for label, variable in [('api','RENDER_API_SERVICE_ID'),('web','RENDER_WEB_SERVICE_ID')]:
              service = os.environ.get(variable)
              if not key or not service:
                  results.append({'service':label,'status':'unavailable','reason':'Required repository deployment secret is not configured for this runner.'})
                  continue
              if not service.startswith('srv-') or not all(c.isalnum() or c == '-' for c in service):
                  results.append({'service':label,'status':'invalid service identifier'})
                  continue
              base = 'https://api.render.com/v1/services/' + service
              def fetch(suffix):
                  request = urllib.request.Request(base + suffix, headers={'Authorization':'Bearer '+key,'Accept':'application/json'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)
              try:
                  entries = fetch('/env-vars?limit=100')
                  # Never print environment entries or secret values. Project only
                  # the allowlisted, nonsecret NODE_VERSION selector.
                  node = None
                  for entry in entries:
                      env = entry.get('envVar', entry)
                      if env.get('key') == 'NODE_VERSION':
                          node = env.get('value')
                  deploys = fetch('/deploys?limit=1')
                  latest = deploys[0].get('deploy', deploys[0]) if deploys else {}
                  results.append({'service':label,'status':'read','nodeSelector':node,'latestDeployStatus':latest.get('status'),'latestCommit':latest.get('commit',{}).get('id')})
              except urllib.error.HTTPError as error:
                  results.append({'service':label,'status':'read failed','httpStatus':error.code})
              except Exception as error:
                  results.append({'service':label,'status':'read failed','errorType':type(error).__name__})
          print(json.dumps({'head':os.environ['GITHUB_SHA'],'externalRuntimeObservations':results,'changesMade':False}, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('Read-only external runtime observation; this job does not certify a deployment.\n')
          PY
