name: PR 993 test runtime repair

# Temporary head-guarded dependency repair and reproducible debugging snapshot.
on:
  push:
    branches: [dependabot/npm_and_yarn/npm-deps-bf6561acc1]
    paths: [.github/workflows/pr-993-test-runtime.yml]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-993-test-runtime
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the current PR input
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/4444J99/peer-audited--behavioral-blockchain/pulls/993 --jq '.head.sha')" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Declare each browser-test workspace's own Jest environment
        run: |
          npm install --global npm@10.8.2 --ignore-scripts
          npm view jest-environment-jsdom@30.5.1 version engines peerDependencies --json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for directory in ['src/web', 'src/desktop']:
              path = Path(directory) / 'package.json'
              package = json.loads(path.read_text())
              assert 'jest-environment-jsdom' not in package['devDependencies']
              package['devDependencies']['jest-environment-jsdom'] = '30.5.1'
              path.write_text(json.dumps(package, indent=2) + '\n')
          PY
      - name: Regenerate and clean-install the complete dependency graph
        env:
          npm_config_engine_strict: 'true'
        run: |
          npm install --package-lock-only --ignore-scripts --strict-peer-deps --no-audit --no-fund
          npm ci --strict-peer-deps --no-audit --no-fund
          npm audit --audit-level=low
          node --test scripts/validation/dependency-regressions.test.cjs
          node <<'JS'
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const assert = require('node:assert/strict');
          for (const directory of ['src/web', 'src/desktop']) {
            const from = createRequire(path.resolve(directory, 'package.json'));
            assert.equal(from('jest-environment-jsdom/package.json').version, '30.5.1');
            assert.ok(from('jest-environment-jsdom').TestEnvironment);
          }
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-993-browser-test-deps-${{ github.sha }}
          path: |
            package-lock.json
            src/web/package.json
            src/desktop/package.json
          if-no-files-found: error
          retention-days: 2
      - name: Capture independent application diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/pr993-results"
          npm run build --workspace @styx/shared
          set +e
          for workspace in api web desktop; do
            for task in lint test build; do
              npm run "$task" --workspace "@styx/$workspace" > "$RUNNER_TEMP/pr993-results/$workspace-$task.log" 2>&1
              code=$?
              printf '%s %s %s\n' "$workspace" "$task" "$code" | tee -a "$RUNNER_TEMP/pr993-results/results.txt"
              grep -E 'error TS|FAIL |Error:|Test Suites:|Tests:|Test Files|error |Error ' "$RUNNER_TEMP/pr993-results/$workspace-$task.log" | head -80
            done
          done
          echo 'Diagnostic collection is not a passing application-validation receipt.'
      - name: Export only source, public package installations, and the selected Node runtime
        run: |
          mkdir -p .ci-runtime/bin .ci-runtime/lib/node_modules
          cp "$(command -v node)" .ci-runtime/bin/node
          cp -a "$(npm root -g)/npm" .ci-runtime/lib/node_modules/npm
          ln -s ../lib/node_modules/npm/bin/npm-cli.js .ci-runtime/bin/npm
          ln -s ../lib/node_modules/npm/bin/npx-cli.js .ci-runtime/bin/npx
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          names = [p for p in paths if p]
          names += [b'node_modules', b'.ci-runtime']
          for parent in ['src','packages']:
              for directory in pathlib.Path(parent).glob('*/node_modules'):
                  if directory.is_dir(): names.append(str(directory).encode())
          for directory in pathlib.Path('src/shared').glob('dist'):
              if directory.is_dir(): names.append(str(directory).encode())
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp/'snapshot-paths').write_bytes(b'\0'.join(names) + b'\0')
          (temp/'pr993-results'/'snapshot.json').write_text(json.dumps({'inputHead':os.environ['GITHUB_SHA'],'node':subprocess.check_output(['node','--version'],text=True).strip(),'npm':subprocess.check_output(['npm','--version'],text=True).strip(),'changes':['src/web/package.json','src/desktop/package.json','package-lock.json'],'credentialsIncluded':False},indent=2))
          PY
          # No .git, runner home, environment dump, registry credentials, or
          # deployment secrets are part of the snapshot.
          tar --zstd -cf "$RUNNER_TEMP/pr993-results/node24-workspace.tar.zst" --null -T "$RUNNER_TEMP/snapshot-paths"
          sha256sum "$RUNNER_TEMP/pr993-results/node24-workspace.tar.zst" > "$RUNNER_TEMP/pr993-results/snapshot.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr-993-test-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/pr993-results
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr-993-browser-test-deps-${{ github.sha }}
          path: ${{ runner.temp }}/validated-test-deps
      - name: Publish only the validated three-file dependency repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/4444J99/peer-audited--behavioral-blockchain/pulls/993 --jq '.head.sha')" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json, os, pathlib, shutil, urllib.parse
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'validated-test-deps'
          files = ['package-lock.json','src/web/package.json','src/desktop/package.json']
          for file in files:
              source = root/file
              assert source.is_file() and not source.is_symlink() and source.stat().st_size < 10000000
          for folder in ['src/web','src/desktop']:
              expected = json.loads((pathlib.Path(folder)/'package.json').read_text())
              expected['devDependencies']['jest-environment-jsdom'] = '30.5.1'
              assert json.loads((root/folder/'package.json').read_text()) == expected
          lock = json.loads((root/'package-lock.json').read_text())
          assert lock['lockfileVersion'] == 3
          for manifest in [pathlib.Path('package.json'),*pathlib.Path('src').glob('*/package.json'),*pathlib.Path('packages').glob('*/package.json')]:
              folder = '' if manifest.parent == pathlib.Path('.') else manifest.parent.as_posix()
              source = root/manifest if folder in ['src/web','src/desktop'] else manifest
              package = json.loads(source.read_text())
              for field in ['dependencies','devDependencies','optionalDependencies','engines']:
                  assert lock['packages'][folder].get(field,{}) == package.get(field,{}), (folder,field)
          for key, record in lock['packages'].items():
              resolved = record.get('resolved')
              if resolved and not record.get('link'):
                  url = urllib.parse.urlsplit(resolved)
                  assert url.scheme == 'https' and url.hostname == 'registry.npmjs.org', key
          for file in files: shutil.copyfile(root/file,file)
          PY
          git diff --check
          git add -- package-lock.json src/web/package.json src/desktop/package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(test): declare compatible jsdom environments in web and desktop workspaces'
          git push origin HEAD:refs/heads/dependabot/npm_and_yarn/npm-deps-bf6561acc1
          printf 'Dependency repair published at `%s`; application diagnostics are separately recorded.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
