name: PR 994 integration inspection
on:
  push:
    branches: [work/lane-verify/ci-gate-fixes-2026-09-17]
    paths: [.github/workflows/pr994-integration-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect actual three-way integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/integration"
          mkdir -p "$out"
          base="$(git rev-parse origin/lane/verify)"
          ancestor="$(git merge-base HEAD "$base")"
          git rev-parse HEAD > "$out/head.txt"
          printf '%s\n' "$base" > "$out/base.txt"
          printf '%s\n' "$ancestor" > "$out/ancestor.txt"
          git archive --format=tar.gz HEAD > "$out/head.tar.gz"
          git archive --format=tar.gz "$base" > "$out/base.tar.gz"
          git archive --format=tar.gz "$ancestor" > "$out/ancestor.tar.gz"
          git log --oneline "$ancestor..$base" > "$out/target-commits.txt"
          git log --oneline "$ancestor..HEAD" > "$out/pr-commits.txt"
          git diff --stat "$ancestor" "$base" > "$out/target-diff-stat.txt"
          gh api repos/${{ github.repository }}/branches/lane%2Fverify > "$out/branch.json"
          gh api repos/${{ github.repository }}/rulesets > "$out/rulesets.json" || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff "$base" > "$out/merge.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$out/merge-exit.txt"
          git diff --name-only --diff-filter=U > "$out/conflicts.txt"
          git diff > "$out/conflicts.diff"
          git merge --abort || true
          cat "$out/conflicts.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@10.8.2
      - name: Strict dependency acceptance and advisory data
        run: |
          out="$RUNNER_TEMP/integration"
          set +e
          npm ci --engine-strict --strict-peer-deps > "$out/strict-install.log" 2>&1
          printf '%s\n' "$?" > "$out/strict-install-exit.txt"
          npm audit --json > "$out/audit.json" 2> "$out/audit-errors.txt"
          printf '%s\n' "$?" > "$out/audit-exit.txt"
          npm view decode-uri-component versions --json > "$out/decode-versions.json"
          npm view query-string@latest version engines dependencies --json > "$out/query-string-latest.json"
          npm view xcode@latest version dependencies --json > "$out/xcode-latest.json"
          npm view @react-navigation/native@latest version dependencies --json > "$out/navigation-latest.json"
          node --version > "$out/node.txt"
          npm --version > "$out/npm.txt"
          exit 0
      - name: Retain exact inputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr994-integration-${{ github.sha }}
          path: ${{ runner.temp }}/integration/
          retention-days: 7
