name: PR 993 API compatibility repair

# Temporary deterministic source repair; remove after validated publication.
on:
  push:
    branches: [dependabot/npm_and_yarn/npm-deps-bf6561acc1]
    paths:
      - .github/workflows/pr-993-api-repair.yml
      - .github/scripts/pr993-api-repair.py
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-993-api-repair
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the exact open PR input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/4444J99/peer-audited--behavioral-blockchain/pulls/993 > "$RUNNER_TEMP/pr.json"
          python3 - <<'PY'
          import json, os
          pr = json.load(open(os.environ['RUNNER_TEMP'] + '/pr.json'))
          assert pr['state'] == 'open'
          assert pr['head']['repo']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert pr['head']['ref'] == 'dependabot/npm_and_yarn/npm-deps-bf6561acc1'
          assert pr['head']['sha'] == os.environ['GITHUB_SHA']
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply the reviewed type-only imports and scoped Jest launcher
        run: python3 .github/scripts/pr993-api-repair.py
      - name: Install the committed dependency graph without changing it
        env:
          npm_config_engine_strict: 'true'
        run: |
          npm install --global npm@10.8.2 --ignore-scripts
          npm ci --strict-peer-deps --no-audit --no-fund
          npm audit --audit-level=low
          git diff --exit-code -- package-lock.json
      - name: Verify complete API types, production build, and coverage-enforced tests
        run: |
          npm run build --workspace @styx/shared
          npm run lint --workspace @styx/api
          npm run build --workspace @styx/api
          npm run test --workspace @styx/api -- --runInBand
          git diff --check
          printf 'Validated source repair against `%s` on `%s`.\n' "$GITHUB_SHA" "$(node --version)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr-993-api-coverage-${{ github.sha }}
          path: src/api/coverage/
          retention-days: 7
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Recompute and publish only the source edits that passed validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/4444J99/peer-audited--behavioral-blockchain/pulls/993 > "$RUNNER_TEMP/pr.json"
          python3 - <<'PY'
          import json, os
          pr = json.load(open(os.environ['RUNNER_TEMP'] + '/pr.json'))
          assert pr['state'] == 'open'
          assert pr['head']['repo']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert pr['head']['ref'] == 'dependabot/npm_and_yarn/npm-deps-bf6561acc1'
          assert pr['head']['sha'] == os.environ['GITHUB_SHA'], 'Refusing stale publication'
          PY
          # Only the reviewed standard-library script from the input commit is
          # executed with write credentials; no application or artifact code.
          python3 .github/scripts/pr993-api-repair.py > "$RUNNER_TEMP/api-changed.txt"
          python3 - <<'PY'
          import os, pathlib, subprocess
          expected = set((pathlib.Path(os.environ['RUNNER_TEMP'])/'api-changed.txt').read_text().splitlines())
          actual = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual == expected and len(actual) == 17, actual ^ expected
          assert all(file.startswith('src/api/') for file in actual)
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(api): preserve typed injection and run Nest 12 tests through native ESM support'
          git push origin HEAD:refs/heads/dependabot/npm_and_yarn/npm-deps-bf6561acc1
          printf 'Validated input: `%s`\nPublished source head: `%s`\n' "$GITHUB_SHA" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
