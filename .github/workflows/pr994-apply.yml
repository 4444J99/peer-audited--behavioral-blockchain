name: Apply guarded PR 994 repairs
on:
  push:
    branches: [work/lane-verify/ci-gate-fixes-2026-09-17]
    paths: [.github/pr994-input/**, .github/workflows/pr994-apply.yml]
permissions:
  contents: write
concurrency:
  group: pr994-guarded-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/work/lane-verify/ci-gate-fixes-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pr994_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source ancestry and apply the reviewed delta
        run: |
          mkdir -p "$RUNNER_TEMP/pr994-evidence"
          python3 <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          baseline='c1a8804a3b6cfb19606aeb91f3dc37e6759fe7d7'
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines()
          allowed={'.github/pr994-input/part-01','.github/pr994-input/part-02','.github/pr994-input/part-03','.github/workflows/pr994-apply.yml'}
          assert set(changed)<=allowed, f'Concurrent source changes require reconciliation: {changed}'
          text=''.join(pathlib.Path(f'.github/pr994-input/part-{i:02}').read_text().strip() for i in range(1,4))
          raw=lzma.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='cfa3356b8fcb01bdd7f9ec10416f6bd5168da2269eb9a9e45d38a96657d13607', 'Payload checksum mismatch'
          changes=json.loads(raw)
          for entry in changes:
            path=pathlib.Path(entry['path'])
            assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
            old=path.read_bytes() if path.exists() else b''
            assert hashlib.sha256(old).hexdigest()==entry['old_sha256'], f'Stale source: {path}'
          for entry in changes:
            path=pathlib.Path(entry['path'])
            lines=path.read_text().splitlines(True) if path.exists() else []
            for start,end,replacement in reversed(entry['edits']): lines[start:end]=[replacement]
            path.parent.mkdir(parents=True,exist_ok=True)
            path.write_text(''.join(lines))
          # Workflows are published later through the authorized connector. The
          # Actions token commits only application files and inert staging blobs.
          stage=pathlib.Path('.github/pr994-workflow-staging');stage.mkdir()
          for entry in changes:
            path=pathlib.Path(entry['path'])
            if str(path).startswith('.github/workflows/'):
              (stage/path.name).write_bytes(path.read_bytes())
          subprocess.run(['git','add','--all'],check=True)
          subprocess.run(['git','restore','--source=HEAD','--staged','--worktree','.github/workflows'],check=True)
          subprocess.run(['git','rm','-r','.github/pr994-input'],check=True)
          print(f'Applied {len(changes)} source deltas; workflow blobs retained for authorized publication.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@10.8.2
      - name: Regenerate and deduplicate the complete workspace lockfile
        run: |
          set -o pipefail
          npm install --package-lock-only --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/lock-regeneration.log"
          npm dedupe --package-lock-only --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/pr994-evidence/lock-dedupe.log"
          git add package-lock.json
          git diff --cached --check
      - name: Commit and fast-forward only the requested PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: work/lane-verify/ci-gate-fixes-2026-09-17
        run: |
          gh auth setup-git
          current="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$current" = "$EXPECTED_HEAD" || { echo 'Branch advanced; refusing to overwrite concurrent work'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(styx): repair PR 994 review findings and dependency graph'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/pr994-evidence/head.txt"
          git ls-tree HEAD .github/pr994-workflow-staging/ > "$RUNNER_TEMP/pr994-evidence/workflow-blobs.txt"
      - name: Execute repair verification without write credentials
        env:
          PR994_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pr994_test
        run: bash scripts/ci/verify-pr994.sh
      - name: Capture source and staged-workflow identifiers
        if: always()
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pr994-evidence/source.tar.gz"
          cp package-lock.json "$RUNNER_TEMP/pr994-evidence/package-lock.json"
          git rev-parse HEAD > "$RUNNER_TEMP/pr994-evidence/head.txt"
          git ls-tree HEAD .github/pr994-workflow-staging/ > "$RUNNER_TEMP/pr994-evidence/workflow-blobs.txt"
      - name: Retain repair evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr994-repair-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr994-evidence/*.log
            ${{ runner.temp }}/pr994-evidence/*.json
            ${{ runner.temp }}/pr994-evidence/*.txt
            ${{ runner.temp }}/pr994-evidence/*.tsv
            ${{ runner.temp }}/pr994-evidence/source.tar.gz
          retention-days: 14
