version: 2
updates:
  # Single npm ecosystem root. This is an npm-workspaces monorepo (`src/*`,
  # `packages/*`) with one authoritative lockfile at the root, and every CI job
  # installs with `npm ci` from the root. Listing workspace members here as
  # separate roots made Dependabot edit a member manifest without regenerating
  # the root lockfile, so `npm ci` failed with "Missing: <pkg> from lock file"
  # (e.g. #842) and raised duplicate PRs for one bump (#842 vs #843).
  # Dependabot resolves workspace members from the root manifest on its own.
  - package-ecosystem: "npm"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-deps:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions-deps:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directories:
      - "/.config/docker"
      - "/src/api"
      - "/src/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      docker-deps:
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directories:
      - "/src/desktop/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      cargo-deps:
        patterns: ["*"]
  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      terraform-providers:
        patterns: ["*"]
