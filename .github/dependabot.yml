version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/audience-engine"
      - "/packages/audit-engine"
      - "/packages/styx-cli"
      - "/apps/api"
      - "/apps/ask-styx"
      - "/apps/desktop"
      - "/apps/mobile"
      - "/apps/pitch"
      - "/apps/shared"
      - "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-deps:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions-deps:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directories:
      - "/.config/docker"
      - "/apps/api"
      - "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      docker-deps:
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directories:
      - "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      cargo-deps:
        patterns: ["*"]
  - package-ecosystem: "terraform"
    directory: "/infrastructure/terraform"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      terraform-providers:
        patterns: ["*"]
