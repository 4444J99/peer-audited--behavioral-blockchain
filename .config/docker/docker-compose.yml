services:
  # The Styx API (Workstream 1)
  styx-api:
    build:
      context: ../..
      dockerfile: src/api/Dockerfile
      args:
        API_CONTAINER_PORT: ${STYX_DOCKER_API_CONTAINER_PORT:?STYX_DOCKER_API_CONTAINER_PORT is required}
    ports:
      - "${STYX_DOCKER_API_PORT:?STYX_DOCKER_API_PORT is required}:${STYX_DOCKER_API_CONTAINER_PORT:?STYX_DOCKER_API_CONTAINER_PORT is required}"
    environment:
      NODE_ENV: ${STYX_DOCKER_API_NODE_ENV:?STYX_DOCKER_API_NODE_ENV is required}
      PORT: ${STYX_DOCKER_API_CONTAINER_PORT:?STYX_DOCKER_API_CONTAINER_PORT is required}
      DATABASE_URL: ${STYX_DOCKER_DATABASE_URL:?STYX_DOCKER_DATABASE_URL is required}
      REDIS_URL: ${STYX_DOCKER_REDIS_URL:?STYX_DOCKER_REDIS_URL is required}
      STYX_API_PUBLIC_URL: ${STYX_API_PUBLIC_URL:?STYX_API_PUBLIC_URL is required}
      STYX_WEB_PUBLIC_URL: ${STYX_WEB_PUBLIC_URL:?STYX_WEB_PUBLIC_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Required app secrets — the 2026-05-26 hardening removed insecure fallbacks,
      # so the API throws at use-time if these are unset. Passed through from the
      # env file (compose.defaults.env for local, real values via Render in prod).
      JWT_SECRET: ${JWT_SECRET:-}
      APP_SECRET: ${APP_SECRET:-}
      ANONYMIZE_SALT: ${ANONYMIZE_SALT:-}
      ZK_EXHAUST_SECRET: ${ZK_EXHAUST_SECRET:-}
      STYX_WEBHOOK_SECRET: ${STYX_WEBHOOK_SECRET:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      styx-postgres:
        condition: service_healthy
      styx-redis:
        condition: service_started
      # The API never runs DDL itself — it must not boot before the migration
      # chain has fully applied.
      styx-migrate:
        condition: service_completed_successfully
    networks:
      - styx-network

  # One-shot migration runner. The database schema comes EXCLUSIVELY from the
  # migration chain (src/api/database/migrations/*.sql) applied by migrate.ts.
  # schema.sql is a reference snapshot only and is deliberately NOT mounted
  # into /docker-entrypoint-initdb.d/: initdb-provisioned databases froze at
  # schema.sql's table set and made migrate.ts baseline-stamp (skip) every
  # migration, so migration-only tables could never exist on a fresh install.
  # Reuses the API image's builder stage, which carries the migration sources
  # and dev dependencies (tsx).
  styx-migrate:
    build:
      context: ../..
      dockerfile: src/api/Dockerfile
      target: builder
    working_dir: /app/src/api
    command: ["npx", "tsx", "database/migrations/migrate.ts"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: ${STYX_DOCKER_DATABASE_URL:?STYX_DOCKER_DATABASE_URL is required}
    depends_on:
      styx-postgres:
        condition: service_healthy
    networks:
      - styx-network

  # Core Ledger Database (PostgreSQL)
  # Schema is NOT provisioned here. A fresh volume starts empty; the
  # styx-migrate service applies the full migration chain before the API
  # starts. Demo data (seed.sql) is applied post-migration by
  # `bash scripts/deploy.sh local` (or `... seed`) — never via initdb.
  styx-postgres:
    image: ${STYX_DOCKER_POSTGRES_IMAGE:?STYX_DOCKER_POSTGRES_IMAGE is required}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "${STYX_DOCKER_POSTGRES_PORT:?STYX_DOCKER_POSTGRES_PORT is required}:${POSTGRES_PORT:?POSTGRES_PORT is required}"
    volumes:
      - styx-pg-data:/var/lib/postgresql/data
      # Read-only copy for the deploy script's post-migration seed step.
      - ../../src/api/database/seed.sql:/opt/styx/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - styx-network

  # Core Router Queue (Redis)
  styx-redis:
    image: ${STYX_DOCKER_REDIS_IMAGE:?STYX_DOCKER_REDIS_IMAGE is required}
    restart: always
    ports:
      - "${STYX_DOCKER_REDIS_PORT:?STYX_DOCKER_REDIS_PORT is required}:${REDIS_PORT:?REDIS_PORT is required}"
    networks:
      - styx-network
    command: redis-server --appendonly yes
    volumes:
      - styx-redis-data:/data

  # Web Dashboard (Next.js)
  styx-web:
    build:
      context: ../..
      dockerfile: src/web/Dockerfile
      args:
        WEB_CONTAINER_PORT: ${STYX_DOCKER_WEB_CONTAINER_PORT:?STYX_DOCKER_WEB_CONTAINER_PORT is required}
    ports:
      - "${STYX_DOCKER_WEB_PORT:?STYX_DOCKER_WEB_PORT is required}:${STYX_DOCKER_WEB_CONTAINER_PORT:?STYX_DOCKER_WEB_CONTAINER_PORT is required}"
    environment:
      NODE_ENV: ${STYX_DOCKER_WEB_NODE_ENV:?STYX_DOCKER_WEB_NODE_ENV is required}
      PORT: ${STYX_DOCKER_WEB_CONTAINER_PORT:?STYX_DOCKER_WEB_CONTAINER_PORT is required}
      NEXT_PUBLIC_API_URL: ${STYX_DOCKER_API_INTERNAL_URL:?STYX_DOCKER_API_INTERNAL_URL is required}
      STYX_WEB_PUBLIC_URL: ${STYX_WEB_PUBLIC_URL:?STYX_WEB_PUBLIC_URL is required}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-}
    depends_on:
      - styx-api
    networks:
      - styx-network

volumes:
  styx-pg-data:
  styx-redis-data:

networks:
  styx-network:
    driver: bridge
